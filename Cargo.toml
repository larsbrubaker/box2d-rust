[workspace]
members = [".", "demo/wasm"]

[package]
name = "box2d-rust"
version = "1.4.0"
edition = "2021"
rust-version = "1.77"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
description = "Pure Rust port of the Box2D v3 2D physics engine"
license = "MIT"
repository = "https://github.com/larsbrubaker/box2d-rust"
homepage = "https://larsbrubaker.github.io/box2d-rust/"
documentation = "https://docs.rs/box2d-rust/"
readme = "README.md"
keywords = ["physics", "box2d", "2d", "simulation", "gamedev"]
categories = ["simulation", "game-development", "algorithms"]
exclude = [
    "box2d-cpp-reference/",
    "demo/",
    "docs/",
    "tests/",
    ".github/",
    ".claude/",
    "benches/",
    "scripts/",
    "CLAUDE.md",
    "readme_hero.jpg",
    "run_demo.cmd",
]

[lib]
name = "box2d_rust"
path = "src/lib.rs"

[features]
default = ["web-time"]
# Mirrors BOX2D_DOUBLE_PRECISION: double precision world positions for large worlds.
double-precision = []
# Browser clock (performance.now() via web-time/wasm-bindgen) on wasm32-unknown-unknown.
# Disable (default-features = false) for non-browser WASM hosts such as Wasmtime,
# and optionally install a clock with timer::set_clock.
web-time = ["dep:web-time"]

[dependencies]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = { version = "1", optional = true }

[dev-dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
